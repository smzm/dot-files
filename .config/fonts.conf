<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<fontconfig>

    <!-- ============================================================
         Generic font family preferences
         ============================================================ -->

    <!-- Serif -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>Estedad</family>
            <family>Inter</family>
            <family>SF Compact</family>
        </prefer>
    </alias>

    <!-- Sans-serif -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Estedad</family>
            <family>Inter</family>
            <family>SF Compact</family>
        </prefer>
    </alias>

    <!-- Monospace -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>SFMono</family>
            <family>DM Mono</family>
        </prefer>
    </alias>


    <!-- ============================================================
         Font rendering
         ============================================================ -->

    <match target="font">

        <!-- Antialiasing -->
        <edit mode="assign" name="antialias">
            <bool>true</bool>
        </edit>

        <!-- Hinting -->
        <edit mode="assign" name="hinting">
            <bool>true</bool>
        </edit>

        <!-- Light hinting is generally preferable on modern displays -->
        <edit mode="assign" name="hintstyle">
            <const>hintslight</const>
        </edit>

    </match>

</fontconfig>
