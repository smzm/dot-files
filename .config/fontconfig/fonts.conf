<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<fontconfig>

    <!-- Use Inter as the default UI font -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Estedad</family>
            <family>Inter</family>
        </prefer>
    </alias>

    <!-- Use Inter for serif as well -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>Inter</family>
        </prefer>
    </alias>

    <!-- Use a real monospace font for terminals/code -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>SF Mono</family>
            <family>JetBrainsMono Nerd Font</family>
        </prefer>
    </alias>

    <!-- Enable font antialiasing -->
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
    </match>

</fontconfig>
